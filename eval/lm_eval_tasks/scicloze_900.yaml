# SciCloze-900（veyra-ai/SciCloze-900）：900 道英文科学 4 选 1 完形填空。
# 与 lm-eval 内置的 arc/openbookqa 同为 multiple_choice：对每个选项算续写对数似然，
# acc = 选项似然最高且正确；acc_norm = 按选项字节数归一化后再比。
task: scicloze_900
dataset_path: veyra-ai/SciCloze-900
output_type: multiple_choice
validation_split: validation
doc_to_text: "{{prompt}}"
doc_to_choice: "{{choices}}"
doc_to_target: "{{answer}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
